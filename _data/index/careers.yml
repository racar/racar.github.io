# Employment timeline. Looped by _includes/sections/career.html — edit here,
# not in HTML.
#
# Fields:
#   name      company (or project)
#   link      optional external URL
#   context   sector / division shown next to the company
#   role      job title
#   start/end YYYY-MM (or a free-form year range for multi-employer periods)
#   duration  PRECOMPUTED string — Liquid cannot do date math, so this is
#             maintained by hand
#   tier      featured | standard | brief  (drives the visual treatment)
#   metric    short verifiable stat, rendered as a chip
#   summary   one or two sentences
#   highlights bullet list, featured roles only
#   stack     comma-separated, rendered as chips
#
# The consulting era 2015-2020 is ONE entry, not three. Three overlapping
# short contracts read as a series of stints; one multi-client engagement with
# named clients reads as deliberate independence. Matches the CV.
#
# Anchor: career starts 2009 at Corficolombiana. "15+ years in tech" on the CV
# and site refers to that span; "11+" would refer to full-time development
# from 2015.

