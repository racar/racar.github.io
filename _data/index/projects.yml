# Featured projects. Looped by _includes/sections/projects.html and
# _layouts/case-study.html — everything rendered is parameterised here so a
# second project needs no template edits.

- name: RentaFIC
  tagline: Real returns of Colombian FICs & FPVs
  # lede names the gap in the market. This is the memorable sentence — it goes
  # straight under the title, not buried in descr.
  lede: >-
    Colombian investors compare nominal fund returns — a number that is inflated
    by inflation and quietly reduced by fees. RentaFIC recalculates the real
    cumulative return of 900+ FICs and 500+ FPVs, monthly. No competitor in
    Colombia publishes inflation-adjusted figures.
  # descr explains how it was solved.
  descr: >-
    Data comes from Colombia's open government portal (datos.gov.co) and official
    SFC filings — neither offers a clean API. A PySpark pipeline normalises and
    joins the sources into Supabase, a Streamlit frontend serves the public
    rankings and per-fund analysis, and a Mistral-powered chatbot answers fund
    questions in natural language. Deployed with Docker on a VPS, updated by
    GitHub Actions + Watchtower.
  kind: Founder & Lead Engineer
  year: 2026
  status: Live
  image: rentafic-hero.webp
  # 2.46:1 banner — the real asset ratio. Used for both width/height attrs and
  # aspect-ratio so there is zero layout shift.
  image_width: 1797
  image_height: 730
  image_alt: >-
    RentaFIC ranking screen showing the top 20 FICs by real 12-month return
  image_srcset_900: rentafic-hero-900.webp
  website: https://rentafic.co
  case_study: /rentafic/
  github: https://github.com/racar
  metrics:
    - value: 900+
      label: FICs tracked
    - value: 500+
      label: FPVs tracked
    - value: Monthly
      label: refresh cadence
  highlights:
    - PySpark pipeline sourcing datos.gov.co + official SFC data
    - Mintlify-inspired Streamlit UX — public ranking plus per-fund analysis charts
    - Supabase authentication and user management
    - Mistral-powered AI chatbot for fund questions
    - Docker on VPS with GitHub Actions + Watchtower for zero-downtime updates
    - Spec-driven, AI-assisted workflow (Claude Code + OpenCode)
  stack: Python, PySpark, Streamlit, Supabase, Mistral, Docker, GitHub Actions
